<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Dashboard logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37e6a0"/>
      <stop offset="52%" stop-color="#3aa8ff"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </linearGradient>
  </defs>

  <!-- outer shell -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#g)" stroke-width="3.5" opacity="0.9"/>

  <!-- orbital arc -->
  <path d="M 60 18 A 42 42 0 0 1 96 78" fill="none" stroke="url(#g)" stroke-width="2"
        stroke-linecap="round" opacity="0.55"/>

  <!-- core node -->
  <circle cx="60" cy="46" r="15" fill="none" stroke="url(#g)" stroke-width="4"/>
  <circle cx="60" cy="46" r="5.5" fill="url(#g)"/>

  <!-- tether to the trailing node -->
  <line x1="55" y1="58" x2="38" y2="76" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- trailing node -->
  <circle cx="35" cy="80" r="9" fill="none" stroke="url(#g)" stroke-width="3.2"/>
  <circle cx="35" cy="80" r="3" fill="url(#g)"/>
</svg>
